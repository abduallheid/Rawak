# Builds the site with the same Jekyll/gem versions as GitHub Pages, refreshes
# GitHub stats at build time (no runtime API calls), and deploys.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly refresh of GitHub stats (Monday 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh GitHub stats
        run: node scripts/fetch-github-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build
        env: { JEKYLL_ENV: production, LANG: C.UTF-8, LC_ALL: C.UTF-8 }
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
